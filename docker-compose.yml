version: "3.8"

services:
  steam-updater:
    build: .
    image: steam-updater:latest
    container_name: steam-updater

    env_file:
      - .env

    volumes:
      - ${STEAMCMD_DATA_PATH}:/root/.local/share/Steam
      - ${LIBRARY_PATH}:/library
      - ${COMPOSE_PATH}/update_library.sh:/scripts/update_library.sh:ro
      - ${COMPOSE_PATH}/logs:/scripts/logs:rw

    restart: unless-stopped
    entrypoint: ["/bin/bash", "-c", "while true; do FORCE_UPDATE=1 /bin/bash /scripts/update_library.sh; sleep 86400; done"]

